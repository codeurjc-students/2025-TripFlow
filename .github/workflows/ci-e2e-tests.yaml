name: CI - E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/ci-e2e-tests.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/ci-e2e-tests.yaml'
  
  workflow_dispatch:

jobs:
  e2e-testing:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Start services with Docker Compose
        working-directory: ./docker
        run: docker compose --env-file .env.example -f docker-compose.test.yaml up -d

      - name: Wait for services to be healthy
        working-directory: ./scripts
        run: |
          chmod +x run-wait-for-services.sh
          ./run-wait-for-services.sh

      # Official Playwright image has browsers preinstalled. Keep the tag in sync with @playwright/test.
      - name: Run Playwright tests
        run: |
          docker run --rm --network host \
            -e FRONTEND_URL=http://localhost \
            -v "$PWD/e2e:/e2e" -w /e2e \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            sh -c "npm ci && npx playwright test"