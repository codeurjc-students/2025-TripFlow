openapi: 3.1.0
info:
  title: TripFlow API
  description: "API documentation for TripFlow, the travel planning application."
  version: v1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- auth_token: []
tags:
- name: Itinerary Share Links
  description: Endpoints for generating and consuming itinerary share links
- name: AI Generation
  description: AI generation and processing
- name: Statistics
  description: Endpoints for retrieving statistics
- name: Itinerary Collaboration
  description: Endpoints for managing itinerary collaborators and invitations
- name: Users Management
  description: User management and operations
- name: Health Check
  description: Endpoint for checking the health status of the application
- name: Authentication
  description: Endpoints for user authentication and authorization
- name: Itinerary Management
  description: Endpoints for managing itineraries
paths:
  /api/v1/users/{username}:
    get:
      tags:
      - Users Management
      summary: Get user by username
      description: Retrieves a user by their username.
      operationId: getUserByUsername
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: User retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
    put:
      tags:
      - Users Management
      summary: Update user by username
      description: Updates a user by their username.
      operationId: updateUser
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: User updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
      security:
      - auth_token: []
    delete:
      tags:
      - Users Management
      summary: Delete user by username
      description: Deletes a user by their username.
      operationId: deleteUser
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: User deleted successfully
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - auth_token: []
  /api/v1/itineraries/{itineraryId}/collaborators/{username}:
    put:
      tags:
      - Itinerary Collaboration
      summary: Update Collaborator Role
      description: Updates a collaborator's role. Only owner can do this.
      operationId: updateCollaboratorRole
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: username
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollaboratorRequest"
        required: true
      responses:
        "200":
          description: Collaborator updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "400":
          description: Invalid request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "404":
          description: Itinerary or collaborator not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
      security:
      - auth_token: []
    delete:
      tags:
      - Itinerary Collaboration
      summary: Remove Collaborator
      description: "Removes a collaborator. Owner can remove anyone, collaborators\
        \ can remove themselves."
      operationId: removeCollaborator
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Collaborator removed
        "403":
          description: Forbidden
        "404":
          description: Itinerary or collaborator not found
      security:
      - auth_token: []
  /api/v1/itineraries/{itineraryId}/collaborators/{username}/accept:
    put:
      tags:
      - Itinerary Collaboration
      summary: Accept Invitation
      description: Accepts a pending invitation to collaborate on an itinerary.
      operationId: acceptInvitation
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Invitation accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "400":
          description: Invitation is not pending
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "404":
          description: Invitation not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
      security:
      - auth_token: []
  /api/v1/itineraries/{id}:
    get:
      tags:
      - Itinerary Management
      summary: Get Itinerary by ID
      description: Retrieves the details of a specific itinerary by its ID for the
        authenticated user.
      operationId: getItineraryById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Itinerary retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "404":
          description: Itinerary not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "403":
          description: Access to the itinerary is forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
      security:
      - auth_token: []
    put:
      tags:
      - Itinerary Management
      summary: Update Itinerary
      description: Updates an existing itinerary for the authenticated user.
      operationId: updateItinerary
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendedItineraryDTO"
        required: true
      responses:
        "200":
          description: Itinerary updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "400":
          description: Invalid itinerary data provided
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "404":
          description: Itinerary not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "403":
          description: Access to the itinerary is forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
      security:
      - auth_token: []
    delete:
      tags:
      - Itinerary Management
      summary: Delete Itinerary
      description: Deletes an existing itinerary for the authenticated user.
      operationId: deleteItinerary
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Itinerary deleted successfully
        "401":
          description: Unauthorized access
        "404":
          description: Itinerary not found
        "403":
          description: Access to the itinerary is forbidden
        "500":
          description: Internal server error
      security:
      - auth_token: []
  /api/v1/users/{username}/avatar:
    get:
      tags:
      - Users Management
      summary: Get avatar for user by username
      description: Retrieves an avatar for a user by their username.
      operationId: getAvatar
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Avatar retrieved successfully
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                type: string
                format: binary
      security:
      - auth_token: []
    post:
      tags:
      - Users Management
      summary: Upload avatar for user by username
      description: Uploads an avatar for a user by their username.
      operationId: uploadAvatar
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required:
              - avatar
      responses:
        "200":
          description: Avatar uploaded successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
        "415":
          description: Unsupported media type
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicUserDTO"
      security:
      - auth_token: []
  /api/v1/itineraries/{itineraryId}/share-links:
    get:
      tags:
      - Itinerary Share Links
      summary: Get Active Share Links
      description: Returns active share links for an itinerary. Owner and accepted
        collaborators can view.
      operationId: getActiveShareLinks
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Share links retrieved
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLinkDTO"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLinkDTO"
        "404":
          description: Itinerary not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLinkDTO"
      security:
      - auth_token: []
    post:
      tags:
      - Itinerary Share Links
      summary: Generate Share Link
      description: Generates a public read-only share link with fixed expiration.
        Only itinerary owner can generate.
      operationId: generateShareLink
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          description: Share link generated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareLinkDTO"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareLinkDTO"
        "404":
          description: Itinerary not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareLinkDTO"
      security:
      - auth_token: []
  /api/v1/itineraries/{itineraryId}/collaborators:
    get:
      tags:
      - Itinerary Collaboration
      summary: Get Collaborators
      description: Gets all collaborators of an itinerary.
      operationId: getCollaborators
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Collaborators found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollaboratorDTO"
        "404":
          description: Itinerary not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollaboratorDTO"
      security:
      - auth_token: []
    post:
      tags:
      - Itinerary Collaboration
      summary: Send Invitation
      description: Sends an invitation to a user to collaborate on an itinerary. Only
        owner can do this.
      operationId: sendInvitation
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCollaboratorRequest"
        required: true
      responses:
        "201":
          description: Invitation sent
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "400":
          description: Invalid request or user is owner
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "404":
          description: Itinerary or user not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
        "409":
          description: User already has a pending invitation or is a collaborator
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollaboratorDTO"
      security:
      - auth_token: []
  /api/v1/itineraries:
    get:
      tags:
      - Itinerary Management
      summary: Get All Itineraries
      description: Retrieves a paginated list of itineraries for the authenticated
        user.
      operationId: getAllItineraries
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      - name: search
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Itineraries retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOItineraryResponseDTO"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOItineraryResponseDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOItineraryResponseDTO"
      security:
      - auth_token: []
    post:
      tags:
      - Itinerary Management
      summary: Create Itinerary
      description: Creates a new itinerary for the authenticated user.
      operationId: createItinerary
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendedItineraryDTO"
        required: true
      responses:
        "201":
          description: Itinerary created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "400":
          description: Invalid itinerary data provided
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
      security:
      - auth_token: []
  /api/v1/itineraries/:
    get:
      tags:
      - Itinerary Management
      summary: Get All Itineraries
      description: Retrieves a paginated list of itineraries for the authenticated
        user.
      operationId: getAllItineraries_1
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      - name: search
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Itineraries retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOItineraryResponseDTO"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOItineraryResponseDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOItineraryResponseDTO"
      security:
      - auth_token: []
    post:
      tags:
      - Itinerary Management
      summary: Create Itinerary
      description: Creates a new itinerary for the authenticated user.
      operationId: createItinerary_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendedItineraryDTO"
        required: true
      responses:
        "201":
          description: Itinerary created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "400":
          description: Invalid itinerary data provided
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
      security:
      - auth_token: []
  /api/v1/ai:
    post:
      tags:
      - AI Generation
      summary: Submit AI Processing Request
      description: Submits a request for AI processing based on user preferences.
      operationId: handleAIRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIGenerationRequest"
        required: true
      responses:
        "200":
          description: AI request submitted successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AIResponse"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AIResponse"
        "429":
          description: Too many requests - daily AI usage limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AIResponse"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AIResponse"
      security:
      - auth_token: []
  /api/auth/verify:
    post:
      tags:
      - Authentication
      summary: Account Verification Endpoint
      description: Verifies a user account using the provided code.
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAccountRequest"
        required: true
      responses:
        "200":
          description: Account verified successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Account verification failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/resend-code:
    post:
      tags:
      - Authentication
      summary: Resend Verification Code
      description: Resends the verification code to the user's email.
      operationId: resendCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendCodeRequest"
        required: true
      responses:
        "200":
          description: Verification code sent successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Failed to resend verification code
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: User Registration Endpoint
      description: Registers a new user with the provided details.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
        required: true
      responses:
        "201":
          description: User registered successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: User registration failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Token Refresh Endpoint
      description: Refreshes the authentication token using a valid refresh token.
      operationId: refresh
      parameters:
      - name: refresh_token
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Token refreshed successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Token refresh failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/logout:
    post:
      tags:
      - Authentication
      summary: User Logout Endpoint
      description: Logs out the authenticated user and terminates the session.
      operationId: logout
      responses:
        "200":
          description: User logged out successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: User logout failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: User Login Endpoint
      description: Authenticates a user and initiates a session.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: User logged in successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: User login failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/users:
    get:
      tags:
      - Users Management
      summary: Get all users
      description: Retrieves a list of all users.
      operationId: getAllUsers
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      - name: search
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Users retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOPublicUserDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedDTOPublicUserDTO"
  /api/v1/users/{username}/invitations:
    get:
      tags:
      - Users Management
      summary: Get pending invitations
      description: Retrieves all pending collaboration invitations for a user.
      operationId: getPendingInvitations
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Invitations retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollaboratorDTO"
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollaboratorDTO"
      security:
      - auth_token: []
  /api/v1/stats/user:
    get:
      tags:
      - Statistics
      summary: Get User Statistics
      description: Retrieves statistics related to the authenticated user.
      operationId: getUserStats
      responses:
        "200":
          description: User statistics retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStatsDTO"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStatsDTO"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStatsDTO"
      security:
      - auth_token: []
  /api/v1/share/{token}:
    get:
      tags:
      - Itinerary Share Links
      summary: Get Shared Itinerary
      description: Returns a read-only itinerary by share token. Public endpoint.
      operationId: getSharedItinerary
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Shared itinerary retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "403":
          description: Share link expired or revoked
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
        "404":
          description: Share link not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExtendedItineraryResponseDTO"
  /api/v1/ai/status:
    get:
      tags:
      - AI Generation
      summary: Get AI Status
      description: Retrieves the AI status for the authenticated user.
      operationId: getAIStatus
      responses:
        "200":
          description: AI status retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AIStatus"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AIStatus"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AIStatus"
      security:
      - auth_token: []
  /api/health/:
    get:
      tags:
      - Health Check
      summary: Health Check Endpoint
      description: Returns the health status of the application.
      operationId: healthCheck
      responses:
        "200":
          description: Application is healthy
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/health:
    get:
      tags:
      - Health Check
      summary: Health Check Endpoint
      description: Returns the health status of the application.
      operationId: healthCheck_1
      responses:
        "200":
          description: Application is healthy
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/itineraries/{itineraryId}/share-links/{shareLinkId}:
    delete:
      tags:
      - Itinerary Share Links
      summary: Revoke Share Link
      description: Revokes a share link. Only itinerary owner can revoke.
      operationId: revokeShareLink
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: shareLinkId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Share link revoked
        "403":
          description: Forbidden
        "404":
          description: Itinerary or share link not found
      security:
      - auth_token: []
  /api/v1/itineraries/{itineraryId}/collaborators/{username}/decline:
    delete:
      tags:
      - Itinerary Collaboration
      summary: Decline Invitation
      description: Declines a pending invitation to collaborate on an itinerary.
      operationId: declineInvitation
      parameters:
      - name: itineraryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Invitation declined
        "400":
          description: Invitation is already accepted or invalid
        "404":
          description: Invitation not found
      security:
      - auth_token: []
