server.port=8080
spring.application.name=tripflow-api-service

# Server Performance & Encoding
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# JSON Date Format (Prevent timezone issues)
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# OpenAPI / Swagger
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/tripflow_db}
spring.datasource.username=${POSTGRES_USER:tripflow_user}
spring.datasource.password=${POSTGRES_PASSWORD:secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Logging configuration
logging.level.root=INFO
logging.level.com.tripflow=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# CORS Configuration
origins.frontend=${ORIGINS_FRONTEND:http://localhost}

# Cookies Configuration
cookie.domain=${COOKIE_DOMAIN:localhost}
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Admin User Configuration
admin.email=${ADMIN_EMAIL}
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Unsplash API Configuration
unsplash.api.key=${UNSPLASH_API_KEY}

# Maps API Configuration
maps.enabled=${MAPS_ENABLED:false}
maps.provider=${MAPS_PROVIDER:mock}
maps.timeout.ms=${MAPS_TIMEOUT_MS:5000}
maps.cache.ttl-seconds.search=${MAPS_CACHE_TTL_SECONDS_SEARCH:300}
maps.cache.ttl-seconds.directions=${MAPS_CACHE_TTL_SECONDS_DIRECTIONS:300}
maps.cache.cleanup-ms=${MAPS_CACHE_CLEANUP_MS:3600000}

# MapTiler API Configuration
maptiler.api.key=${MAPTILER_API_KEY:}
maptiler.api.base-url.geocoding=${MAPTILER_GEOCODING_BASE_URL:https://api.maptiler.com/geocoding}
maptiler.api.base-url.static=${MAPTILER_STATIC_BASE_URL:https://api.maptiler.com/maps}

# OpenRouteService API Configuration (Directions)
openrouteservice.api.key=${OPENROUTESERVICE_API_KEY:}
openrouteservice.api.base-url=${OPENROUTESERVICE_API_BASE_URL:https://api.openrouteservice.org/v2/directions}

# Collaboration share-link configuration
collaboration.share-link.ttl-hours=${COLLABORATION_SHARE_LINK_TTL_HOURS:168}
